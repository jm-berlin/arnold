t du dich im Alltag? (Kühlschrank zählt nicht.)","start.conditionsHint":"z. B. Herz, Blutdruck, Knie, Rücken. Dann vorher ärztlich abklären – Helden fragen nach.","start.create":"Plan her","start.err.goals":"Irgendein Ziel wirst du doch haben. Eins reicht.","start.err.sports":"Mindestens eine Sportart. „Zu Hause“ zählt, Fernbedienung nicht.","toast.done":"Stark. Erledigt! Arnold nickt anerkennend.","toast.planned":"Dein Plan steht. Ganz entspannt – das ist kein Bootcamp.","toast.weight":"Eingetragen. Die Waage hat nichts gesagt.","backup.remindNone":"Noch keine Sicherung. Wenn das Handy ins Klo fällt, sind deine Heldentaten weg.","settings.resetConfirm":"Wirklich alles löschen? Ohne Sicherung ist es weg. Für immer. Wie deine Jugend.","update.generic":"Unter der Haube geschraubt. Läuft jetzt noch runder.","home.title":"Was machen wir *heute*, Chef?","home.sumDone":"Training erledigt. Ab jetzt nur noch essen und angeben.","home.tile.shopNone":"Alles da. Sogar Gemüse.","land.kicker":"FITNESS FÜR FAULE","land.title":"Fit werden. *Ohne* Bootcamp.","land.lead":"{name} ist die Fitness-App für Männer, die eigentlich keine Lust haben. Jeden Tag ein kurzes Training und Essen, das man auch ohne Kochkurs hinkriegt – passend zu Ziel, Alter und Sportart. Kein Abo, keine Anmeldung, kein Gebrüll.","land.how3.t":"Abhaken, wenn’s erledigt ist. Tag ausgelassen? Passiert den Besten. Morgen geht’s weiter.","land.final":"Bereit? Dauert *zwei* Minuten. Kürzer als die Werbepause."},en:{"brand.greeting":"Alright, sports star.","brand.audience":"for men whose favourite exercise so far was channel surfing","today.title":"Today, a *little* is enough. Seriously.","today.titleDone":"*Done* for today. Sofa earned.","today.go":"Fine, let’s go →","today.skip":"Not today, boss","today.skipped":"Skipped. We won’t tell anyone.","today.free":"Day off. Officially.","today.freeText":"Rest is training for advanced players. Walking to the bakery still counts.","today.week":"This week: {done} of {total} wor nt, pas d’inscription, pas de coach qui hurle.","land.how3.t":"Coche quand c’est fait. Un jour raté ? Ça arrive aux meilleurs. On continue demain.","land.final":"Prêt ? Ça prend *deux* minutes. Moins que la pub."},es:{"brand.greeting":"¿Qué pasa, campeón?","brand.audience":"para hombres cuyo ejercicio favorito hasta ahora era hacer zapping","today.title":"Hoy basta con *poco*. En serio.","today.titleDone":"*Hecho* por hoy. Sofá ganado.","today.go":"Venga, vamos →","today.skip":"Hoy no, jefe","today.skipped":"Saltado. No se lo diremos a nadie.","today.free":"Día libre. Oficialmente.","today.freeText":"Descansar es entrenamiento de nivel avanzado. Ir andando a por el pan también cuenta.","today.week":"Esta semana: {done} de {total}. Arnold estaría … bueno, en camino.","meal.leftover":"Sobras, día {d} de {n} – como manda el manual del soltero","meal.cook":"Cocinar hoy: da para {n} días","checkup.text":"Aviso rápido: ¿50 o más, o problemas de salud? Primero al médico. Sí, por voluntad propia. Es un momento, y luego nadie te puede decir nada.","checkup.ok":"Lo haré, prometido","week.rest":"Descanso – el sofá tiene preferencia","training.finish":"Hecho. Soy una bestia.","training.easier":"¿Muy duro? Hay una versión para blandos (también vale)","training.how":"Cómo se hace (sin destrozarte la espalda)","shop.empty":"No falta nada. Nevera llena, hombre feliz.","progress.first":"Apunta tu peso de vez en cuando. Una vez por semana basta: la báscula no es tu ex, no hace falta mirarla cada día.","progress.noEx":"Aún nada. Tu primer entrenamiento te espera y te mira con reproche.","progress.up":"+{n} kg desde el inicio. Músculo. Seguro que es músculo.","progress.down":"−{n} kg desde el inicio. Bien hecho.","start.title":"En forma, *sin* dramas.","start.lead":"Unas preguntas y cada día un pequeño plan. Sin promesas de tableta, sin dieta de pechuga a la plancha. ¿Un día perdido? Le pasa a los mejores.","start.goalsHint":"Puedes elegir varios. Ser sincero ayuda.","start.activity":"¿Cuánto te mueves en el día a día? (La nevera no cuenta.)","start.conditionsHint":"p. ej. corazón, tensión, rodillas, espalda. Primero al médico: los héroes preguntan.","start.create":"Dame el plan","start.err.goals":"Algún objetivo tendrás. Con uno basta.","start.err.sports":"Al menos un deporte. «En casa» cuenta, el mando a distancia no.","toast.done":"¡Bien! Hecho. Arnold asiente con aprobación.","toast.planned":"Tu plan está listo. Tranquilo, esto no es la mili.","toast.weight":"Guardado. La báscula no ha dicho nada.","backup.remindNone":"Aún no hay copia. Si el móvil se te cae al váter, tus hazañas desaparecen.","settings.resetConfirm":"¿Borrarlo todo de verdad? Sin copia, se pierde. Para siempre. Como tu juventud.","update.generic":"Hemos trasteado bajo el capó. Ahora va aún más fino.","home.title":"¿Qué hacemos *hoy*, jefe?","home.sumDone":"Entrenamiento hecho. Ahora toca comer y presumir.","home.tile.shopNone":"No falta nada. Ni siquiera verdura.","land.kicker":"FITNESS PARA VAGOS","land.title":"Ponte en forma. *Sin* campamento militar.","land.lead":"{name} es la app de fitness para hombres que, en realidad, no tienen ganas. Cada día un entrenamiento corto y comida que sale sin curso de cocina, según tu objetivo, edad y deporte. Sin suscripción, sin registro, sin gritos.","land.how3.t":"Márcalo cuando esté hecho. ¿Un día perdido? Le pasa a los mejores. Mañana se sigue.","land.final":"¿Listo? Son *dos* minutos. Menos que los anuncios."},it:{"brand.greeting":"Ciao, campione.","brand.audience":"per uomini il cui esercizio preferito finora era fare zapping","today.title":"Oggi basta *poco*. Davvero.","today.titleDone":"*Fatto* per oggi. Divano meritato.","today.go":"E va bene, via →","today.skip":"Oggi no, capo","today.skipped":"Saltato. Non lo diciamo a nessuno.","today.free":"Giorno libero. Ufficialmente.","today.freeText":"Il riposo è allenamento per esperti. Andare a piedi a prendere il pane conta comunque.","today.week":"Questa settimana: {done} su {total}. Arnold sarebbe … diciamo, sulla buona strada.","meal.leftover":"Avanzi, giorno {d} di {n} – dal manuale dello scapolo","meal.cook":"Da cucinare oggi: basta per {n} giorni","checkup.text":"Breve annuncio: over 50 o problemi di salute? Prima dal medico. Sì, di tua spontanea volontà. Ci vuole poco, e poi nessuno può dirti niente.","checkup.ok":"Ci vado, promesso","week.rest":"Riposo – il divano ha la precedenza","training.finish":"Finito. Sono una belva.","training.easier":"Troppo duro? C’è la versione per mammolette (va bene lo stesso)","training.how":"Come si fa (senza rovinarsi la schiena)","shop.empty":"Non serve altro. Frigo pieno, uomo felice.","progress.first":"Annota il peso ogni tanto. Una volta a settimana basta: la bilancia non è la tua ex, non serve controllarla ogni giorno.","progress.noEx":"Ancora niente. Il primo allenamento ti aspetta e ti guarda con aria di rimprovero.","progress.up":"+{n} kg dall’inizio. Muscoli. Di sicuro muscoli.","progress.down":"−{n} kg dall’inizio. Pulito.","start.title":"In forma, *senza* drammi.","start.lead":"Poche domande e ogni giorno un piccolo piano. Niente promesse di addominali scolpiti, niente dieta a petto di pollo. Saltato un giorno? Capita ai migliori.","start.goalsHint":"Puoi sceglierne più di uno. Essere sinceri aiuta.","start.activity":"Quanto ti muovi durante la giornata? (Il frigo non conta.)","start.conditionsHint":"es. cuore, pressione, ginocchia, schiena. Prima chiedi al medico: gli eroi chiedono.","start.create":"Dammi il piano","start.err.goals":"Un obiettivo ce l’avrai pure. Ne basta uno.","start.err.sports":"Almeno uno sport. «A casa» conta, il telecomando no.","toast.done":"Grande. Fatto! Arnold annuisce soddisfatto.","toast.planned":"Il tuo piano è pronto. Tranquillo, non è il militare.","toast.weight":"Salvato. La bilancia non ha detto niente.","backup.remindNone":"Ancora nessun backup. Se il telefono finisce nel water, le tue imprese spariscono.","settings.resetConfirm":"Vuoi davvero eliminare tutto? Senza backup è perso. Per sempre. Come la tua giovinezza.","update.generic":"Abbiamo smanettato sotto il cofano. Ora va ancora meglio.","home.title":"Cosa facciamo *oggi*, capo?","home.sumDone":"Allenamento fatto. Ora solo mangiare e vantarsi.","home.tile.shopNone":"Non manca niente. Nemmeno la verdura.","land.kicker":"FITNESS PER PIGRI","land.title":"In forma. *Senza* naja.","land.lead":"{name} è l’app di fitness per uomini che in fondo non ne hanno voglia. Ogni giorno un allenamento breve e pasti che si fanno anche senza corso di cucina, in base a obiettivo, età e sport. Niente abbonamento, niente registrazione, niente urla.","land.how3.t":"Spunta quando hai finito. Saltato un giorno? Capita ai migliori. Domani si continua.","land.final":"Pronto? Bastano *due* minuti. Meno della pubblicità."}},tone:"Ironisch, Kumpel-Ton: wie Männer untereinander reden, wenn sie sich gegenseitig auf die Schippe nehmen. Zum Schmunzeln, nie verletzend, nie belehrend. Über Faulheit lachen, nicht über Körper.",schemes:{navy:{label:"Navy & Signalorange",light:{bg:"#FFFFFF",surface:"#F2F4F7","surface-2":"#E6EAF0",ink:"#0B1B33",muted:"#55607A",line:"#DDE2EA",accent:"#FF5A1F","accent-soft":"#FFE4D6","on-accent":"#0B1B33","accent-text":"#0B1B33",hero:"#0B1B33","on-hero":"#FFFFFF","hero-accent":"#FF5A1F",ok:"#C2410C",danger:"#B42318",highlight:"#FF5A1F"},dark:{bg:"#08111F",surface:"#111C2E","surface-2":"#1A263A",ink:"#EEF2F8",muted:"#9AA6BC",line:"#26334A",accent:"#FF6A33","accent-soft":"#3A2218","on-accent":"#08111F","accent-text":"#FF8A5C",hero:"#111C2E","on-hero":"#FFFFFF","hero-accent":"#FF8A5C",ok:"#FF8A5C",danger:"#F97066",highlight:"#FF6A33"}},mitternacht:{label:"Mitternacht & Grün",light:{bg:"#FFFFFF",surface:"#F3F5F4","surface-2":"#E6EAE8",ink:"#0D1117",muted:"#575E68",line:"#E1E4E8",accent:"#12B76A","accent-soft":"#D3F8E2","on-accent":"#052E1A","accent-text":"#067647",hero:"#101828","on-hero":"#FFFFFF","hero-accent":"#3CF08F",ok:"#067647",danger:"#B42318",highlight:"#079455"},dark:{bg:"#0A0F17",surface:"#131A26","surface-2":"#1C2433",ink:"#EEF2F6",muted:"#98A2B3",line:"#283142",accent:"#32D583","accent-soft":"#0F3323","on-accent":"#052E1A","accent-text":"#47E896",hero:"#131A26","on-hero":"#FFFFFF","hero-accent":"#47E896",ok:"#47E896",danger:"#F97066",highlight:"#47E896"}}},site:"https://jm-berlin.github.io/arnold/"};var S={brand:"arnold",hash:"42d0144475"};var $={en:{goals:{abnehmen:{label:"Lose weight",desc:"Slowly and for good, no crash diet"},fitter:{label:"Get fitter",desc:"More puff, less wheezing on the stairs"},muskeln:{label:"Build muscle",desc:"Get stronger, step by step"},beweglicher:{label:"Be more mobile",desc:"Fewer twinges in the back, more range"},gesuender:{label:"Eat healthier",desc:"More veg, fewer takeaways"}},ageGroups:{u30:{label:"under 30"},"30-49":{label:"30–49"},"50-64":{label:"50–64"},"65+":{label:"65 and over"}},activity:{sitzend:{label:"Mostly sitting (desk, sofa)"},leicht:{label:"Some movement day to day"},aktiv:{label:"On my feet a lot"}},sports:{zuhause:{label:"At home, no equipment"},studio:{label:"Gym"},laufen:{label:"Running / walking"},rad:{label:"Cycling"},schwimmen:{label:"Swimming"}},exercises:{kniebeuge:{name:"Squats",steps:["Feet shoulder-width apart, toes slightly turned out.","Push your bum back as if sitting down on a chair.","Go as low as feels comfortable – knees point towards your toes.","Push back up through your heels."],tip:"Too wobbly? Do them in front of a chair – it’ll catch you."},"stuhl-kniebeuge":{name:"Sit-to-stand",steps:["Sit on the front of a sturdy chair, feet hip-width apart.","Lean forward slightly, arms crossed over your chest.","Stand up without swinging.","Sit back down slowly – don’t just drop."],tip:"The best exercise there is. Sounds trivial, isn’t."},ausfallschritt:{name:"Lunges",steps:["Stand tall, hands on hips.","Take a big step forward.","Lower your back knee towards the floor, front knee stays over your foot.","Push back, switch sides. Reps per side."],tip:"You can put one hand on the wall for balance."},"wand-liegestuetz":{name:"Wall push-ups",steps:["Stand an arm’s length from a wall.","Hands shoulder-width on the wall at chest height.","Keep your body straight and lower your chest to the wall.","Push back powerfully."],tip:"The further away your feet, the harder it gets."},"knie-liegestuetz":{name:"Knee push-ups",steps:["Get on your knees, hands a bit wider than your shoulders.","One line from knees to head – no sagging back.","Lower your chest towards the floor.","Push back up."],tip:"Better 5 clean ones than 10 half ones."},unterarmstuetz:{name:"Forearm plank",steps:["Forearms on the floor, elbows under your shoulders.","On your toes or – easier – on your knees.","Tummy tight, bum neither up nor sagging.","Keep breathing calmly and hold."],tip:"If it shakes, it works. If your back hurts: stop."},beckenheben:{name:"Glute bridge",steps:["Lie on your back, feet flat on the floor.","Squeeze your glutes and lift your hips until knees, hips and shoulders form a line.","Hold briefly.","Lower slowly."],tip:"Good for your back after a long day sitting."},hampelmann:{name:"Jumping jacks",steps:["Stand tall, arms relaxed.","Jump your legs apart and swing your arms overhead.","Jump back.","Keep a relaxed rhythm."],tip:"Neighbours downstairs? Do side steps instead of jumping."},seitschritte:{name:"Side steps with arms",steps:["Step to the side, arms overhead.","Bring your foot in, arms down.","Switch to the other side.","Pace so you could still talk."],tip:"Put some music on. Works wonders."},"katze-kuh":{name:"Cat-cow",steps:["Get on all fours.","Breathe out: round your back like a cat.","Breathe in: let your back dip gently, look forward.","Switch slowly with your breath."],tip:"Ideal right after getting up."},hueftbeuger:{name:"Hip flexor stretch",steps:["One knee on the floor (cushion under it), other foot planted in front.","Push your hips forward slightly until you feel a pull at the front of the hip.","Upper body upright.","Hold, then switch sides."],tip:"If you sit a lot, you need exactly this."},einbeinstand:{name:"Single-leg stand",steps:["Stand next to a chair or a wall.","Lift one leg slightly.","Fix your eyes on a point.","Hold, then switch sides. Only hold on if needed."],tip:"Works while brushing your teeth too."},beinpresse:{name:"Leg press",steps:["Adjust the seat so your knees are at about a right angle.","Feet hip-width in the middle of the plate.","Push away evenly, don’t lock your knees.","Return slowly."],tip:"Choose a weight where the last 2 reps are tough."},"rudern-maschine":{name:"Seated cable row",steps:["Sit upright, handle in both hands.","Pull your elbows back close to your body.","Squeeze your shoulder blades together.","Return under control."],tip:"Don’t rock back and forth with your upper body."},"geh-lauf":{name:"Walk-run intervals",steps:["Walk briskly for 5 minutes to warm up.","Then 1 minute easy jogging, 2 minutes walking – alternating.","Jog slowly enough that you could chat.","Finish with 3 minutes of walking."],tip:"Nobody has to see how slow you are. That’s the beauty of starting out."},"zuegig-gehen":{name:"Brisk walking",steps:["Comfortable shoes, off you go.","Pace so you’re slightly out of breath but can still talk.","Swing your arms.","Add some hills if it feels good."],tip:"Podcast on, phone in pocket, out the door."},"rad-locker":{name:"Easy cycling",steps:["Check saddle height: leg almost straight at the bottom.","Pedal smoothly, rather in an easy gear.","Keep a medium pace.","Roll out for the last 5 minutes."],tip:"Also counts: cycling to work."},"schwimmen-locker":{name:"Easy swimming",steps:["Swim two easy lengths to warm up.","Then swim lengths at your own pace, breaks at the edge allowed.","Change strokes as you like.","Finish with one very easy length."],tip:"Very easy on the joints – ideal from 50."}},recipes:{"overnight-oats":{name:"Overnight oats with berries",ingredients:["Rolled oats","Skyr or low-fat quark","Berries (frozen)","Honey","Nuts"],steps:["Divide the oats and skyr between three jars or tubs, add a splash of water to each, stir.","Berries on top, 1 tsp honey each.","Lids on, into the fridge. In the morning sprinkle nuts on top, done."],tip:"Keeps three days. Zero effort in the morning – that’s the whole trick."},"ruehrei-brot":{name:"Scrambled eggs on wholegrain bread",ingredients:["Eggs","Wholegrain bread","Tomato","Butter"],steps:["Whisk the eggs, season with salt and pepper.","Melt the butter in the pan, add the eggs, stir slowly over medium heat.","Eat with the bread and tomato."],tip:"Don’t cook them too hot – that way they get creamy instead of rubbery."},"chili-sin-carne":{name:"Chilli sin carne",ingredients:["Kidney beans (tin)","Sweetcorn (tin)","Chopped tomatoes (tin)","Onion","Pepper","Rice","Oil","Chilli, cumin, paprika"],steps:["Cook the rice according to the packet.","Dice the onion and peppers, fry in the oil for 5 minutes, add the spices.","Add tomatoes, rinsed beans and corn, simmer for 20 minutes.","Divide into three tubs with the rice – ready for three days."],tip:"Tastes better on day two. Scientifically unproven, practically certain."},"haehnchen-pfanne":{name:"Chicken and veg stir-fry with rice",ingredients:["Chicken breast","Rice","Stir-fry veg (frozen)","Oil","Soy sauce"],steps:["Cook the rice according to the packet.","Cut the chicken into strips, fry all over in the oil.","Add the veg, fry for another 8 minutes, deglaze with soy sauce.","Divide into three tubs with the rice."],tip:"Lots of protein, little effort – good if muscle is the goal."},"ofengemuese-feta":{name:"Roast veg with feta",ingredients:["Potatoes","Courgette","Peppers","Onion","Feta","Oil"],steps:["Preheat the oven to 200 °C.","Roughly chop the veg and potatoes, mix with oil, salt and herbs.","Onto the tray, bake for 25 minutes.","Crumble the feta on top, another 5 minutes."],tip:"One tray, hardly any washing up. Leftovers taste good cold the next day too."},linsensuppe:{name:"Red lentil soup",ingredients:["Red lentils","Onion","Carrots","Chopped tomatoes (tin)","Vegetable stock","Oil","Wholegrain bread"],steps:["Finely chop the onion and carrots, soften in the oil.","Add lentils, tomatoes and stock, simmer for 15–20 minutes until the lentils fall apart.","Blend or leave as is, season with salt, pepper and a little lemon.","Eat with a slice of bread each."],tip:"Freezes well too. For lazy days three weeks from now."}}},es:{goals:{abnehmen:{label:"Perder peso",desc:"Poco a poco y para siempre, sin dietas milagro"},fitter:{label:"Ponerme en forma",desc:"Más fondo, menos jadeos en la escalera"},muskeln:{label:"Ganar músculo",desc:"Más fuerte, paso a paso"},beweglicher:{label:"Ganar movilidad",desc:"Menos tirones en la espalda, más margen"},gesuender:{label:"Comer más sano",desc:"Más verdura, menos comida a domicilio"}},ageGroups:{u30:{label:"menos de 30"},"30-49":{label:"30–49"},"50-64":{label:"50–64"},"65+":{label:"65 o más"}},activity:{sitzend:{label:"Casi siempre sentado (oficina, sofá)"},leicht:{label:"Algo de movimiento a diario"},aktiv:{label:"Mucho tiempo de pie"}},sports:{zuhause:{label:"En casa sin material"},studio:{label:"Gimnasio"},laufen:{label:"Correr / caminar"},rad:{label:"Bici"},schwimmen:{label:"Natación"}},exercises:{kniebeuge:{name:"Sentadillas",steps:["Pies a la anchura de los hombros, puntas un poco hacia fuera.","Lleva el culo hacia atrás como si te sentaras en una silla.","Baja hasta donde te resulte cómodo: las rodillas apuntan a los pies.","Sube empujando con los talones."],tip:"¿Demasiado inestable? Hazlas delante de una silla: te recoge."},"stuhl-kniebeuge":{name:"Levantarse de la silla",steps:["Siéntate en el borde de una silla firme, pies a la anchura de la cadera.","Inclina un poco el tronco, brazos cruzados sobre el pecho.","Levántate sin impulso.","Vuelve a sentarte despacio, sin dejarte caer."],tip:"El mejor ejercicio que existe. Parece una tontería, no lo es."},ausfallschritt:{name:"Zancadas",steps:["De pie, erguido, manos en la cadera.","Da un paso largo hacia delante.","Baja la rodilla de atrás hacia el suelo; la de delante queda sobre el pie.","Vuelve empujando y cambia de lado. Repeticiones por lado."],tip:"Puedes apoyar una mano en la pared para no perder el equilibrio."},"wand-liegestuetz":{name:"Flexiones en la pared",steps:["Ponte a un brazo de distancia de una pared.","Manos a la anchura de los hombros en la pared, a la altura del pecho.","Mantén el cuerpo recto y acerca el pecho a la pared.","Empuja con fuerza para volver."],tip:"Cuanto más lejos estén los pies, más difícil."},"knie-liegestuetz":{name:"Flexiones de rodillas",steps:["De rodillas, manos algo más abiertas que los hombros.","Una línea de las rodillas a la cabeza, sin hundir la espalda.","Baja el pecho hacia el suelo.","Vuelve a subir."],tip:"Mejor 5 limpias que 10 a medias."},unterarmstuetz:{name:"Plancha sobre antebrazos",steps:["Antebrazos en el suelo, codos bajo los hombros.","Sobre las puntas de los pies o, más fácil, sobre las rodillas.","Abdomen firme, culo ni arriba ni caído.","Respira con calma y aguanta."],tip:"Si tiembla, funciona. Si duele la espalda: para."},beckenheben:{name:"Puente de glúteos",steps:["Túmbate boca arriba, pies apoyados.","Aprieta los glúteos y sube la cadera hasta alinear rodillas, cadera y hombros.","Aguanta un momento.","Baja despacio."],tip:"Bueno para la espalda tras mucho rato sentado."},hampelmann:{name:"Saltos de tijera",steps:["De pie, brazos sueltos.","Salta abriendo las piernas y sube los brazos por encima de la cabeza.","Vuelve saltando.","Mantén un ritmo suelto."],tip:"¿Vecinos debajo? Pasos laterales en vez de saltos."},seitschritte:{name:"Pasos laterales con brazos",steps:["Un paso al lado, brazos arriba.","Junta el pie, brazos abajo.","Hacia el otro lado.","A un ritmo que te deje hablar."],tip:"Pon música. Hace milagros."},"katze-kuh":{name:"Gato y vaca",steps:["Ponte a cuatro patas.","Al soltar el aire: redondea la espalda como un gato.","Al tomar aire: deja que la espalda se hunda suavemente, mirada al frente.","Alterna despacio al ritmo de la respiración."],tip:"Ideal justo al levantarte."},hueftbeuger:{name:"Estiramiento del flexor de cadera",steps:["Una rodilla en el suelo (con un cojín), el otro pie apoyado delante.","Lleva la cadera un poco hacia delante hasta notar el estiramiento delante.","Tronco erguido.","Aguanta y cambia de lado."],tip:"Si pasas mucho tiempo sentado, necesitas justo esto."},einbeinstand:{name:"Equilibrio a una pierna",steps:["Ponte junto a una silla o una pared.","Levanta un poco una pierna.","Fija la vista en un punto.","Aguanta y cambia de lado. Agárrate solo si hace falta."],tip:"También vale mientras te lavas los dientes."},beinpresse:{name:"Prensa de piernas",steps:["Ajusta el asiento para que las rodillas queden en ángulo recto más o menos.","Pies a la anchura de la cadera en el centro de la plataforma.","Empuja de forma uniforme sin bloquear las rodillas.","Vuelve despacio."],tip:"Elige un peso con el que las 2 últimas repeticiones cuesten."},"rudern-maschine":{name:"Remo en polea",steps:["Sentado recto, agarre con ambas manos.","Tira de los codos hacia atrás, pegados al cuerpo.","Junta los omóplatos.","Vuelve con control."],tip:"No balancees el tronco."},"geh-lauf":{name:"Caminar y correr alternando",steps:["5 minutos caminando rápido para calentar.","Luego 1 minuto trotando suave y 2 caminando, alternando.","Trota tan despacio que puedas charlar.","Acaba con 3 minutos caminando."],tip:"Nadie tiene que ver lo lento que vas. Eso es lo bueno de empezar."},"zuegig-gehen":{name:"Caminar a paso ligero",steps:["Zapatillas cómodas y a la calle.","A un ritmo que te deje algo sin aliento pero puedas hablar.","Balancea los brazos.","Con cuestas, si te va bien."],tip:"Podcast puesto, móvil al bolsillo y fuera."},"rad-locker":{name:"Bici suave",steps:["Revisa la altura del sillín: pierna casi estirada abajo.","Pedalea suave, mejor con un desarrollo ligero.","Mantén un ritmo medio.","Los últimos 5 minutos, rueda suelto."],tip:"También cuenta: ir en bici al trabajo."},"schwimmen-locker":{name:"Nadar suave",steps:["Dos largos tranquilos para calentar.","Luego largos a tu ritmo, se vale descansar en el borde.","Cambia de estilo cuando quieras.","Termina con un largo muy suave."],tip:"Muy suave para las articulaciones: ideal a partir de los 50."}},recipes:{"overnight-oats":{name:"Overnight oats con frutos rojos",ingredients:["Copos de avena","Skyr o queso batido 0 %","Frutos rojos (congelados)","Miel","Frutos secos"],steps:["Reparte la avena y el skyr en tres tarros o táperes, añade un chorrito de agua a cada uno y remueve.","Frutos rojos por encima, 1 cdta. de miel en cada uno.","Tapa y a la nevera. Por la mañana, frutos secos por encima y listo."],tip:"Aguanta tres días. Cero esfuerzo por la mañana: ese es todo el truco."},"ruehrei-brot":{name:"Huevos revueltos con pan integral",ingredients:["Huevos","Pan integral","Tomate","Mantequilla"],steps:["Bate los huevos, sal y pimienta.","Derrite la mantequilla en la sartén, añade los huevos y remueve despacio a fuego medio.","Cómelos con el pan y el tomate."],tip:"No los hagas muy fuerte: así quedan cremosos y no como goma."},"chili-sin-carne":{name:"Chili sin carne",ingredients:["Alubias rojas (lata)","Maíz (lata)","Tomate troceado (lata)","Cebolla","Pimiento","Arroz","Aceite","Guindilla, comino, pimentón"],steps:["Cuece el arroz según el paquete.","Corta la cebolla y los pimientos en dados, sofríelos 5 minutos en el aceite y añade las especias.","Añade el tomate, las alubias escurridas y el maíz, y deja cocer 20 minutos.","Reparte en tres táperes con el arroz: listo para tres días."],tip:"Sabe mejor el segundo día. Científicamente sin demostrar, en la práctica seguro."},"haehnchen-pfanne":{name:"Salteado de pollo y verduras con arroz",ingredients:["Pechuga de pollo","Arroz","Verduras para saltear (congeladas)","Aceite","Salsa de soja"],steps:["Cuece el arroz según el paquete.","Corta el pollo en tiras y dóralo en el aceite.","Añade las verduras, 8 minutos más, y riega con la salsa de soja.","Reparte en tres táperes con el arroz."],tip:"Mucha proteína y poco esfuerzo: ideal si buscas músculo."},"ofengemuese-feta":{name:"Verduras al horno con feta",ingredients:["Patatas","Calabacín","Pimientos","Cebolla","Queso feta","Aceite"],steps:["Precalienta el horno a 200 °C.","Corta en trozos las verduras y las patatas, mézclalas con aceite, sal y hierbas.","A la bandeja, 25 minutos al horno.","Desmenuza el feta por encima, 5 minutos más."],tip:"Una bandeja, casi nada que fregar. Lo que sobra está rico frío al día siguiente."},linsensuppe:{name:"Sopa de lentejas rojas",ingredients:["Lentejas rojas","Cebolla","Zanahorias","Tomate troceado (lata)","Caldo de verduras","Aceite","Pan integral"],steps:["Pica la cebolla y las zanahorias y póchalas en el aceite.","Añade las lentejas, el tomate y el caldo, y cuece 15–20 minutos hasta que se deshagan.","Tritura o déjala así; sal, pimienta y un poco de limón.","Cómela con una rebanada de pan cada vez."],tip:"También se puede congelar. Para los días de pereza dentro de tres semanas."}}},fr:{goals:{abnehmen:{label:"Perdre du poids",desc:"Lentement et durablement, sans régime express"},fitter:{label:"Être en forme",desc:"Plus de souffle, moins de halètements dans l’escalier"},muskeln:{label:"Prendre du muscle",desc:"Devenir plus fort, pas à pas"},beweglicher:{label:"Gagner en souplesse",desc:"Moins de tiraillements dans le dos, plus d’amplitude"},gesuender:{label:"Manger plus sain",desc:"Plus de légumes, moins de livraisons"}},ageGroups:{u30:{label:"moins de 30"},"30-49":{label:"30–49"},"50-64":{label:"50–64"},"65+":{label:"65 et plus"}},activity:{sitzend:{label:"Surtout assis (bureau, canapé)"},leicht:{label:"Un peu de mouvement au quotidien"},aktiv:{label:"Souvent debout"}},sports:{zuhause:{label:"À la maison sans matériel"},studio:{label:"Salle de sport"},laufen:{label:"Course / marche"},rad:{label:"Vélo"},schwimmen:{label:"Natation"}},exercises:{kniebeuge:{name:"Squats",steps:["Pieds écartés à largeur d’épaules, pointes légèrement vers l’extérieur.","Pousse les fesses vers l’arrière comme pour t’asseoir sur une chaise.","Descends aussi bas que c’est agréable – les genoux pointent vers les orteils.","Remonte en poussant sur les talons."],tip:"Trop instable ? Fais-les devant une chaise – elle te rattrape."},"stuhl-kniebeuge":{name:"Se lever d’une chaise",steps:["Assieds-toi au bord d’une chaise stable, pieds à largeur de hanches.","Penche légèrement le buste en avant, bras croisés sur la poitrine.","Lève-toi sans élan.","Rassieds-toi lentement – sans te laisser tomber."],tip:"Le meilleur exercice qui existe. Ça a l’air banal, ça ne l’est pas."},ausfallschritt:{name:"Fentes",steps:["Tiens-toi droit, mains sur les hanches.","Fais un grand pas en avant.","Descends le genou arrière vers le sol, le genou avant reste au-dessus du pied.","Repousse, change de côté. Répétitions par côté."],tip:"Tu peux poser une main au mur pour l’équilibre."},"wand-liegestuetz":{name:"Pompes contre le mur",steps:["Place-toi à une longueur de bras d’un mur.","Mains à largeur d’épaules sur le mur, à hauteur de poitrine.","Garde le corps droit et approche la poitrine du mur.","Repousse énergiquement."],tip:"Plus les pieds sont loin, plus c’est difficile."},"knie-liegestuetz":{name:"Pompes sur les genoux",steps:["À genoux, mains un peu plus écartées que les épaules.","Une ligne des genoux à la tête – pas de dos creux.","Descends la poitrine vers le sol.","Remonte."],tip:"Mieux vaut 5 propres que 10 à moitié."},unterarmstuetz:{name:"Gainage sur les avant-bras",steps:["Avant-bras au sol, coudes sous les épaules.","Sur la pointe des pieds ou – plus facile – sur les genoux.","Ventre serré, fesses ni trop hautes ni affaissées.","Respire calmement et tiens."],tip:"Si ça tremble, ça marche. Si le dos fait mal : arrête."},beckenheben:{name:"Pont fessier",steps:["Allonge-toi sur le dos, pieds posés.","Serre les fessiers et monte le bassin jusqu’à ce que genoux, hanches et épaules soient alignés.","Tiens un instant.","Redescends lentement."],tip:"Bon pour le dos après une longue journée assis."},hampelmann:{name:"Jumping jacks",steps:["Debout, bras relâchés.","Saute en écartant les jambes et lève les bras au-dessus de la tête.","Reviens en sautant.","Garde un rythme détendu."],tip:"Des voisins en dessous ? Fais des pas chassés au lieu de sauter."},seitschritte:{name:"Pas latéraux avec les bras",steps:["Un pas sur le côté, bras au-dessus de la tête.","Ramène le pied, bras en bas.","Vers l’autre côté.","Rythme tel que tu pourrais encore parler."],tip:"Mets de la musique. Ça fait des miracles."},"katze-kuh":{name:"Chat-vache",steps:["Mets-toi à quatre pattes.","Expire : arrondis le dos comme un chat.","Inspire : laisse le dos se creuser doucement, regard vers l’avant.","Alterne lentement au rythme de la respiration."],tip:"Idéal juste après le lever."},hueftbeuger:{name:"Étirement des fléchisseurs de hanche",steps:["Un genou au sol (coussin dessous), l’autre pied posé devant.","Avance légèrement le bassin jusqu’à sentir un étirement à l’avant de la hanche.","Buste droit.","Tiens, puis change de côté."],tip:"Si tu es souvent assis, c’est exactement ce qu’il te faut."},einbeinstand:{name:"Équilibre sur une jambe",steps:["Place-toi à côté d’une chaise ou d’un mur.","Lève légèrement une jambe.","Fixe un point du regard.","Tiens, puis change de côté. Tiens-toi seulement si besoin."],tip:"Ça marche aussi en te brossant les dents."},beinpresse:{name:"Presse à cuisses",steps:["Règle le siège pour que les genoux soient à angle droit environ.","Pieds à largeur de hanches au milieu du plateau.","Pousse régulièrement, sans verrouiller les genoux.","Reviens lentement."],tip:"Choisis un poids où les 2 dernières répétitions sont dures."},"rudern-maschine":{name:"Tirage horizontal à la poulie",steps:["Assis bien droit, poignée dans les deux mains.","Tire les coudes vers l’arrière, près du corps.","Serre les omoplates.","Reviens en contrôlant."],tip:"Ne te balance pas avec le haut du corps."},"geh-lauf":{name:"Marche et course en alternance",steps:["5 minutes de marche rapide pour t’échauffer.","Puis 1 minute de course légère, 2 minutes de marche – en alternance.","Cours assez lentement pour pouvoir discuter.","Termine par 3 minutes de marche."],tip:"Personne n’a besoin de voir à quel point tu es lent. C’est ça qui est bien au début."},"zuegig-gehen":{name:"Marche rapide",steps:["Des chaussures confortables, et c’est parti.","Rythme tel que tu sois un peu essoufflé mais puisses encore parler.","Balance les bras.","Avec des montées si ça va bien."],tip:"Podcast lancé, téléphone en poche, dehors."},"rad-locker":{name:"Vélo tranquille",steps:["Vérifie la hauteur de selle : jambe presque tendue en bas.","Pédale en souplesse, plutôt sur un petit braquet.","Garde un rythme moyen.","Roule tranquillement les 5 dernières minutes."],tip:"Ça compte aussi : aller au travail à vélo."},"schwimmen-locker":{name:"Natation tranquille",steps:["Deux longueurs calmes pour t’échauffer.","Puis des longueurs à ton rythme, pauses au bord autorisées.","Change de nage comme tu veux.","Termine par une longueur très tranquille."],tip:"Très doux pour les articulations – idéal dès 50 ans."}},recipes:{"overnight-oats":{name:"Overnight oats aux fruits rouges",ingredients:["Flocons d’avoine","Skyr ou fromage blanc 0 %","Fruits rouges (surgelés)","Miel","Noix"],steps:["Répartis l’avoine et le skyr dans trois bocaux ou boîtes, ajoute un filet d’eau dans chacun, mélange.","Les fruits par-dessus, 1 c. à c. de miel chacun.","Couvercle, au frigo. Le matin, noix par-dessus, c’est prêt."],tip:"Se garde trois jours. Zéro effort le matin – c’est tout le secret."},"ruehrei-brot":{name:"Œufs brouillés et pain complet",ingredients:["Œufs","Pain complet","Tomate","Beurre"],steps:["Bats les œufs, sale, poivre.","Fais fondre le beurre dans la poêle, ajoute les œufs, remue lentement à feu moyen.","Mange avec le pain et la tomate."],tip:"Pas trop chaud – ils restent crémeux au lieu de devenir caoutchouteux."},"chili-sin-carne":{name:"Chili sin carne",ingredients:["Haricots rouges (boîte)","Maïs (boîte)","Tomates concassées (boîte)","Oignon","Poivron","Riz","Huile","Piment, cumin, paprika"],steps:["Cuis le riz selon le paquet.","Coupe l’oignon et les poivrons en dés, fais-les revenir 5 minutes dans l’huile, ajoute les épices.","Ajoute les tomates, les haricots rincés et le maïs, laisse mijoter 20 minutes.","Répartis dans trois boîtes avec le riz – prêt pour trois jours."],tip:"Meilleur le deuxième jour. Scientifiquement non prouvé, en pratique certain."},"haehnchen-pfanne":{name:"Poêlée de poulet et légumes au riz",ingredients:["Blanc de poulet","Riz","Légumes pour poêlée (surgelés)","Huile","Sauce soja"],steps:["Cuis le riz selon le paquet.","Coupe le poulet en lanières, fais-le dorer dans l’huile.","Ajoute les légumes, 8 minutes de plus, déglace à la sauce soja.","Répartis dans trois boîtes avec le riz."],tip:"Beaucoup de protéines, peu d’effort – parfait si tu vises le muscle."},"ofengemuese-feta":{name:"Légumes rôtis à la feta",ingredients:["Pommes de terre","Courgette","Poivrons","Oignon","Feta","Huile"],steps:["Préchauffe le four à 200 °C.","Coupe grossièrement légumes et pommes de terre, mélange avec huile, sel et herbes.","Sur la plaque, 25 minutes au four.","Émiette la feta dessus, encore 5 minutes."],tip:"Une plaque, presque pas de vaisselle. Les restes sont bons froids le lendemain."},linsensuppe:{name:"Soupe de lentilles corail",ingredients:["Lentilles corail","Oignon","Carottes","Tomates concassées (boîte)","Bouillon de légumes","Huile","Pain complet"],steps:["Émince l’oignon et les carottes, fais-les suer dans l’huile.","Ajoute lentilles, tomates et bouillon, laisse mijoter 15–20 minutes jusqu’à ce que les lentilles se défassent.","Mixe ou laisse tel quel, assaisonne avec sel, poivre et un peu de citron.","Mange avec une tranche de pain chacun."],tip:"Se congèle aussi. Pour les jours de flemme dans trois semaines."}}},it:{goals:{abnehmen:{label:"Dimagrire",desc:"Piano piano e per sempre, senza diete lampo"},fitter:{label:"Essere più in forma",desc:"Più fiato, meno affanno sulle scale"},muskeln:{label:"Mettere su muscoli",desc:"Più forte, passo dopo passo"},beweglicher:{label:"Essere più sciolto",desc:"Meno fitte alla schiena, più libertà di movimento"},gesuender:{label:"Mangiare più sano",desc:"Più verdura, meno consegne a domicilio"}},ageGroups:{u30:{label:"meno di 30"},"30-49":{label:"30–49"},"50-64":{label:"50–64"},"65+":{label:"65 e oltre"}},activity:{sitzend:{label:"Quasi sempre seduto (ufficio, divano)"},leicht:{label:"Un po’ di movimento ogni giorno"},aktiv:{label:"Spesso in piedi"}},sports:{zuhause:{label:"A casa senza attrezzi"},studio:{label:"Palestra"},laufen:{label:"Corsa / camminata"},rad:{label:"Bici"},schwimmen:{label:"Nuoto"}},exercises:{kniebeuge:{name:"Squat",steps:["Piedi alla larghezza delle spalle, punte leggermente in fuori.","Porta il sedere indietro come per sederti su una sedia.","Scendi fin dove ti senti a tuo agio: le ginocchia puntano verso le dita dei piedi.","Risali spingendo sui talloni."],tip:"Troppo instabile? Falli davanti a una sedia: ti prende lei."},"stuhl-kniebeuge":{name:"Alzarsi dalla sedia",steps:["Siediti sul bordo di una sedia stabile, piedi alla larghezza dei fianchi.","Busto leggermente in avanti, braccia incrociate sul petto.","Alzati senza slancio.","Risiediti piano, senza lasciarti cadere."],tip:"Il miglior esercizio che esista. Sembra banale, non lo è."},ausfallschritt:{name:"Affondi",steps:["In piedi, dritto, mani sui fianchi.","Fai un passo lungo in avanti.","Abbassa il ginocchio dietro verso il pavimento, quello davanti resta sopra il piede.","Torna spingendo, cambia lato. Ripetizioni per lato."],tip:"Puoi appoggiare una mano al muro per l’equilibrio."},"wand-liegestuetz":{name:"Piegamenti al muro",steps:["Mettiti a un braccio di distanza da un muro.","Mani alla larghezza delle spalle sul muro, all’altezza del petto.","Tieni il corpo dritto e avvicina il petto al muro.","Spingi con forza per tornare."],tip:"Più lontani sono i piedi, più è difficile."},"knie-liegestuetz":{name:"Piegamenti sulle ginocchia",steps:["In ginocchio, mani un po’ più larghe delle spalle.","Una linea dalle ginocchia alla testa, niente schiena incurvata.","Abbassa il petto verso il pavimento.","Risali."],tip:"Meglio 5 fatti bene che 10 a metà."},unterarmstuetz:{name:"Plank sugli avambracci",steps:["Avambracci a terra, gomiti sotto le spalle.","Sulle punte dei piedi o, più facile, sulle ginocchia.","Pancia tesa, sedere né in alto né cadente.","Respira con calma e tieni."],tip:"Se trema, funziona. Se fa male la schiena: fermati."},beckenheben:{name:"Ponte glutei",steps:["Sdraiati sulla schiena, piedi appoggiati.","Stringi i glutei e solleva il bacino finché ginocchia, fianchi e spalle sono in linea.","Tieni un attimo.","Scendi piano."],tip:"Fa bene alla schiena dopo tanto tempo seduto."},hampelmann:{name:"Jumping jack",steps:["In piedi, braccia rilassate.","Salta aprendo le gambe e porta le braccia sopra la testa.","Torna saltando.","Tieni un ritmo sciolto."],tip:"Vicini al piano di sotto? Passi laterali invece dei salti."},seitschritte:{name:"Passi laterali con le braccia",steps:["Un passo di lato, braccia sopra la testa.","Avvicina il piede, braccia giù.","Dall’altra parte.","A un ritmo che ti permetta ancora di parlare."],tip:"Metti la musica. Fa miracoli."},"katze-kuh":{name:"Gatto e mucca",steps:["Mettiti a quattro zampe.","Espira: arrotonda la schiena come un gatto.","Inspira: lascia scendere dolcemente la schiena, sguardo avanti.","Alterna lentamente con il respiro."],tip:"Ideale appena alzato."},hueftbeuger:{name:"Allungamento dei flessori dell’anca",steps:["Un ginocchio a terra (con un cuscino), l’altro piede appoggiato davanti.","Porta il bacino leggermente avanti finché senti tirare davanti all’anca.","Busto dritto.","Tieni, poi cambia lato."],tip:"Se stai molto seduto, ti serve proprio questo."},einbeinstand:{name:"Equilibrio su una gamba",steps:["Mettiti accanto a una sedia o a un muro.","Solleva leggermente una gamba.","Fissa un punto con lo sguardo.","Tieni, poi cambia lato. Reggiti solo se serve."],tip:"Si può fare anche mentre ti lavi i denti."},beinpresse:{name:"Leg press",steps:["Regola il sedile in modo che le ginocchia siano più o meno ad angolo retto.","Piedi alla larghezza dei fianchi al centro della pedana.","Spingi in modo uniforme, senza bloccare le ginocchia.","Torna piano."],tip:"Scegli un peso con cui le ultime 2 ripetizioni sono faticose."},"rudern-maschine":{name:"Rematore al cavo",steps:["Seduto dritto, maniglia con entrambe le mani.","Tira i gomiti indietro, vicini al corpo.","Stringi le scapole.","Torna in modo controllato."],tip:"Non dondolare con il busto."},"geh-lauf":{name:"Camminata e corsa alternate",steps:["5 minuti di camminata veloce per scaldarti.","Poi 1 minuto di corsa leggera e 2 di camminata, alternando.","Corri così piano da poter chiacchierare.","Finisci con 3 minuti di camminata."],tip:"Nessuno deve vedere quanto sei lento. È il bello dell’inizio."},"zuegig-gehen":{name:"Camminata veloce",steps:["Scarpe comode e via.","A un ritmo che ti lasci un po’ senza fiato ma ti permetta di parlare.","Muovi le braccia.","Con qualche salita, se va bene."],tip:"Podcast acceso, telefono in tasca, fuori."},"rad-locker":{name:"Bici tranquilla",steps:["Controlla l’altezza della sella: gamba quasi tesa in basso.","Pedala fluido, meglio con un rapporto leggero.","Tieni un ritmo medio.","Negli ultimi 5 minuti, vai sciolto."],tip:"Conta anche: andare al lavoro in bici."},"schwimmen-locker":{name:"Nuoto tranquillo",steps:["Due vasche tranquille per scaldarti.","Poi vasche al tuo ritmo, le pause a bordo vasca sono ammesse.","Cambia stile quando vuoi.","Finisci con una vasca molto tranquilla."],tip:"Molto delicato per le articolazioni: ideale dai 50 anni."}},recipes:{"overnight-oats":{name:"Overnight oats ai frutti di bosco",ingredients:["Fiocchi d’avena","Skyr o quark magro","Frutti di bosco (surgelati)","Miele","Frutta secca"],steps:["Dividi avena e skyr in tre barattoli o contenitori, aggiungi un goccio d’acqua in ognuno e mescola.","Frutti di bosco sopra, 1 cucchiaino di miele ciascuno.","Coperchio e in frigo. La mattina frutta secca sopra, fatto."],tip:"Si conserva tre giorni. Zero fatica la mattina: è tutto qui il trucco."},"ruehrei-brot":{name:"Uova strapazzate con pane integrale",ingredients:["Uova","Pane integrale","Pomodoro","Burro"],steps:["Sbatti le uova, sale e pepe.","Sciogli il burro in padella, aggiungi le uova e mescola piano a fuoco medio.","Mangiale con il pane e il pomodoro."],tip:"Non troppo calde: così restano cremose invece che gommose."},"chili-sin-carne":{name:"Chili sin carne",ingredients:["Fagioli rossi (lattina)","Mais (lattina)","Pomodori a pezzi (lattina)","Cipolla","Peperone","Riso","Olio","Peperoncino, cumino, paprika"],steps:["Cuoci il riso come indicato sulla confezione.","Taglia a dadini cipolla e peperoni, falli rosolare 5 minuti nell’olio e aggiungi le spezie.","Aggiungi pomodori, fagioli sciacquati e mais, fai sobbollire 20 minuti.","Dividi in tre contenitori con il riso: pronto per tre giorni."],tip:"Il secondo giorno è più buono. Scientificamente non provato, in pratica sicuro."},"haehnchen-pfanne":{name:"Padellata di pollo e verdure con riso",ingredients:["Petto di pollo","Riso","Verdure da padella (surgelate)","Olio","Salsa di soia"],steps:["Cuoci il riso come indicato sulla confezione.","Taglia il pollo a strisce e rosolalo nell’olio.","Aggiungi le verdure, altri 8 minuti, sfuma con la salsa di soia.","Dividi in tre contenitori con il riso."],tip:"Tante proteine, poca fatica: perfetto se l’obiettivo sono i muscoli."},"ofengemuese-feta":{name:"Verdure al forno con feta",ingredients:["Patate","Zucchina","Peperoni","Cipolla","Feta","Olio"],steps:["Preriscalda il forno a 200 °C.","Taglia a pezzi verdure e patate, condisci con olio, sale ed erbe.","Sulla teglia, 25 minuti in forno.","Sbriciola la feta sopra, altri 5 minuti."],tip:"Una teglia, quasi niente da lavare. Gli avanzi sono buoni freddi il giorno dopo."},linsensuppe:{name:"Zuppa di lenticchie rosse",ingredients:["Lenticchie rosse","Cipolla","Carote","Pomodori a pezzi (lattina)","Brodo vegetale","Olio","Pane integrale"],steps:["Trita cipolla e carote e falle appassire nell’olio.","Aggiungi lenticchie, pomodori e brodo, fai sobbollire 15–20 minuti finché le lenticchie si sfaldano.","Frulla o lascia così; sale, pepe e un po’ di limone.","Mangiala con una fetta di pane ciascuno."],tip:"Si può anche congelare. Per i giorni di pigrizia fra tre settimane."}}}};var z={goals:[{id:"abnehmen",label:"Abnehmen",desc:"Langsam und dauerhaft, ohne Crash-Diät",kcalDelta:-400,focus:{kraft:1,ausdauer:2,beweglichkeit:1}},{id:"fitter",label:"Fitter werden",desc:"Mehr Puste, weniger Schnaufen auf der Treppe",kcalDelta:0,focus:{kraft:1,ausdauer:2,beweglichkeit:1}},{id:"muskeln",label:"Muskeln aufbauen",desc:"Kräftiger werden, Schritt für Schritt",kcalDelta:250,focus:{kraft:3,ausdauer:1,beweglichkeit:1}},{id:"beweglicher",label:"Beweglicher werden",desc:"Weniger Zwicken im Rücken, mehr Spielraum",kcalDelta:0,focus:{kraft:1,ausdauer:1,beweglichkeit:3}},{id:"gesuender",label:"Gesünder essen",desc:"Mehr Gemüse, weniger Lieferdienst",kcalDelta:0,focus:{kraft:1,ausdauer:1,beweglichkeit:1}}],ageGroups:[{id:"u30",label:"unter 30",refAge:25,intensity:1,progressEveryWeeks:2,restFactor:1,lowImpact:!1,mobilityItems:1,balanceItems:0,checkup:!1},{id:"30-49",label:"30–49",refAge:40,intensity:.95,progressEveryWeeks:2,restFactor:1,lowImpact:!1,mobilityItems:1,balanceItems:0,checkup:!1},{id:"50-64",label:"50–64",refAge:57,intensity:.85,progressEveryWeeks:3,restFactor:1.5,lowImpact:!0,mobilityItems:2,balanceItems:1,checkup:!0},{id:"65+",label:"65 und älter",refAge:70,intensity:.7,progressEveryWeeks:4,restFactor:2,lowImpact:!0,mobilityItems:2,balanceItems:1,checkup:!0}],activity:[{id:"sitzend",label:"Meist sitzend (Büro, Sofa)",pal:1.2},{id:"leicht",label:"Etwas Bewegung im Alltag",pal:1.375},{id:"aktiv",label:"Viel auf den Beinen",pal:1.55}],sports:[{id:"zuhause",label:"Zu Hause ohne Geräte",kind:"circuit",met:4},{id:"studio",label:"Fitnessstudio",kind:"circuit",met:5},{id:"laufen",label:"Laufen / Gehen",kind:"cardio",met:7,lowImpactMet:3.8},{id:"rad",label:"Radfahren",kind:"cardio",met:6,lowImpactMet:6},{id:"schwimmen",label:"Schwimmen",kind:"cardio",met:6,lowImpactMet:6}],recipes:[{id:"overnight-oats",name:"Overnight Oats mit Beeren",slot:"morgens",servings:3,keepsDays:3,prepMin:5,cookMin:0,perServing:{kcal:415,protein:26,carbs:55,fat:10},tags:["vorkochen","schnell","vegetarisch"],ingredients:[{item:"Haferflocken",qty:150,unit:"g",aisle:"Trockenes"},{item:"Skyr oder Magerquark",qty:450,unit:"g",aisle:"Kühlregal"},{item:"Beeren (TK)",qty:300,unit:"g",aisle:"Tiefkühl"},{item:"Honig",qty:3,unit:"TL",aisle:"Trockenes"},{item:"Nüsse",qty:30,unit:"g",aisle:"Trockenes"}],steps:["Haferflocken und Skyr in drei Gläser oder Dosen verteilen, je einen Schluck Wasser dazu, umrühren.","Beeren obendrauf, je 1 TL Honig.","Deckel drauf, ab in den Kühlschrank. Morgens Nüsse drüber, fertig."],tip:"Hält drei Tage. Morgens null Aufwand – das ist der ganze Trick."},{id:"ruehrei-brot",name:"Rührei mit Vollkornbrot",slot:"morgens",servings:1,keepsDays:0,prepMin:3,cookMin:5,perServing:{kcal:505,protein:27,carbs:40,fat:25},tags:["schnell","vegetarisch","eiweissreich"],ingredients:[{item:"Eier",qty:3,unit:"Stück",aisle:"Kühlregal"},{item:"Vollkornbrot",qty:2,unit:"Scheiben",aisle:"Brot"},{item:"Tomate",qty:1,unit:"Stück",aisle:"Obst & Gemüse"},{item:"Butter",qty:5,unit:"g",aisle:"Kühlregal"}],steps:["Eier verquirlen, salzen, pfeffern.","Butter in der Pfanne schmelzen, Eier rein, bei mittlerer Hitze langsam rühren.","Mit Brot und Tomate essen."],tip:"Nicht zu heiß braten – dann wird’s cremig statt gummiartig."},{id:"chili-sin-carne",name:"Chili sin Carne",slot:"mittags",servings:3,keepsDays:3,prepMin:10,cookMin:25,perServing:{kcal:585,protein:22,carbs:98,fat:8},tags:["vorkochen","vegetarisch"],ingredients:[{item:"Kidneybohnen (Dose)",qty:2,unit:"Dosen",aisle:"Konserven"},{item:"Mais (Dose)",qty:1,unit:"Dose",aisle:"Konserven"},{item:"Gehackte Tomaten (Dose)",qty:2,unit:"Dosen",aisle:"Konserven"},{item:"Zwiebel",qty:1,unit:"Stück",aisle:"Obst & Gemüse"},{item:"Paprika",qty:2,unit:"Stück",aisle:"Obst & Gemüse"},{item:"Reis",qty:200,unit:"g",aisle:"Trockenes"},{item:"Öl",qty:1,unit:"EL",aisle:"Trockenes"},{item:"Chili, Kreuzkümmel, Paprikapulver",qty:1,unit:"Prise",aisle:"Gewürze"}],steps:["Reis nach Packung kochen.","Zwiebel und Paprika würfeln, im Öl 5 Minuten anbraten, Gewürze dazu.","Tomaten, abgespülte Bohnen und Mais dazu, 20 Minuten köcheln.","In drei Dosen mit Reis aufteilen – fertig für drei Tage."],tip:"Schmeckt am zweiten Tag besser. Wissenschaftlich unbewiesen, praktisch sicher."},{id:"haehnchen-pfanne",name:"Hähnchen-Gemüse-Pfanne mit Reis",slot:"mittags",servings:3,keepsDays:3,prepMin:10,cookMin:20,perServing:{kcal:520,protein:42,carbs:62,fat:10},tags:["vorkochen","eiweissreich"],ingredients:[{item:"Hähnchenbrust",qty:450,unit:"g",aisle:"Fleisch & Fisch"},{item:"Reis",qty:200,unit:"g",aisle:"Trockenes"},{item:"Pfannengemüse (TK)",qty:400,unit:"g",aisle:"Tiefkühl"},{item:"Öl",qty:2,unit:"EL",aisle:"Trockenes"},{item:"Sojasauce",qty:3,unit:"EL",aisle:"Trockenes"}],steps:["Reis nach Packung kochen.","Hähnchen in Streifen schneiden, im Öl rundum anbraten.","Gemüse dazu, 8 Minuten mitbraten, mit Sojasauce ablöschen.","Mit Reis in drei Dosen verteilen."],tip:"Viel Eiweiß, wenig Aufwand – gut, wenn Muskeln das Ziel sind."},{id:"ofengemuese-feta",name:"Ofengemüse mit Feta",slot:"abends",servings:2,keepsDays:2,prepMin:10,cookMin:30,perServing:{kcal:550,protein:18,carbs:52,fat:30},tags:["vegetarisch","vorkochen"],ingredients:[{item:"Kartoffeln",qty:500,unit:"g",aisle:"Obst & Gemüse"},{item:"Zucchini",qty:1,unit:"Stück",aisle:"Obst & Gemüse"},{item:"Paprika",qty:2,unit:"Stück",aisle:"Obst & Gemüse"},{item:"Zwiebel",qty:1,unit:"Stück",aisle:"Obst & Gemüse"},{item:"Feta",qty:150,unit:"g",aisle:"Kühlregal"},{item:"Öl",qty:2,unit:"EL",aisle:"Trockenes"}],steps:["Ofen auf 200 °C vorheizen.","Gemüse und Kartoffeln grob schneiden, mit Öl, Salz und Kräutern mischen.","Aufs Blech, 25 Minuten backen.","Feta zerbröseln, drüber, weitere 5 Minuten."],tip:"Ein Blech, kaum Abwasch. Der Rest schmeckt kalt am nächsten Tag auch."},{id:"linsensuppe",name:"Rote Linsensuppe",slot:"abends",servings:4,keepsDays:4,prepMin:10,cookMin:20,perServing:{kcal:390,protein:19,carbs:60,fat:6},tags:["vorkochen","vegetarisch"],ingredients:[{item:"Rote Linsen",qty:250,unit:"g",aisle:"Trockenes"},{item:"Zwiebel",qty:1,unit:"Stück",aisle:"Obst & Gemüse"},{item:"Karotten",qty:2,unit:"Stück",aisle:"Obst & Gemüse"},{item:"Gehackte Tomaten (Dose)",qty:1,unit:"Dose",aisle:"Konserven"},{item:"Gemüsebrühe",qty:1,unit:"l",aisle:"Trockenes"},{item:"Öl",qty:1,unit:"EL",aisle:"Trockenes"},{item:"Vollkornbrot",qty:4,unit:"Scheiben",aisle:"Brot"}],steps:["Zwiebel und Karotten klein schneiden, im Öl andünsten.","Linsen, Tomaten und Brühe dazu, 15–20 Minuten köcheln, bis die Linsen zerfallen.","Pürieren oder so lassen, mit Salz, Pfeffer, etwas Zitrone abschmecken.","Mit je einer Scheibe Brot essen."],tip:"Lässt sich auch einfrieren. Für faule Tage in drei Wochen."}],exercises:[{id:"kniebeuge",name:"Kniebeugen",sports:["zuhause"],category:"kraft",impact:"low",level:1,measure:"reps",base:{sets:3,reps:10,restSec:45},met:5,steps:["Füße schulterbreit, Zehen leicht nach außen.","Po nach hinten schieben, als würdest du dich auf einen Stuhl setzen.","So tief, wie es angenehm geht – Knie zeigen in Richtung Zehen.","Über die Fersen wieder hochdrücken."],tip:"Zu wackelig? Mach sie vor einem Stuhl – der fängt dich auf.",easier:"stuhl-kniebeuge",harder:"ausfallschritt"},{id:"stuhl-kniebeuge",name:"Aufstehen vom Stuhl",sports:["zuhause"],category:"kraft",impact:"low",level:1,measure:"reps",base:{sets:3,reps:8,restSec:60},met:3.5,steps:["Vorne auf einen stabilen Stuhl setzen, Füße hüftbreit.","Oberkörper leicht nach vorn, Arme vor der Brust kreuzen.","Ohne Schwung aufstehen.","Langsam wieder hinsetzen – nicht plumpsen lassen."],tip:"Die beste Übung, die es gibt. Klingt banal, ist sie nicht.",harder:"kniebeuge"},{id:"ausfallschritt",name:"Ausfallschritte",sports:["zuhause"],category:"kraft",impact:"low",level:2,measure:"reps",base:{sets:3,reps:8,restSec:60},met:5,steps:["Aufrecht stehen, Hände in die Hüften.","Einen großen Schritt nach vorn machen.","Hinteres Knie Richtung Boden senken, vorderes Knie bleibt über dem Fuß.","Zurückdrücken, Seite wechseln. Wiederholungen je Seite."],tip:"Zum Festhalten darfst du eine Hand an die Wand legen.",easier:"kniebeuge",lowImpactAlt:"stuhl-kniebeuge"},{id:"wand-liegestuetz",name:"Liegestütze an der Wand",sports:["zuhause"],category:"kraft",impact:"low",level:1,measure:"reps",base:{sets:3,reps:10,restSec:45},met:3.8,steps:["Eine Armlänge vor einer Wand stehen.","Hände schulterbreit auf Brusthöhe an die Wand.","Körper gerade halten und die Brust zur Wand senken.","Kraftvoll zurückdrücken."],tip:"Je weiter die Füße weg sind, desto schwerer.",harder:"knie-liegestuetz"},{id:"knie-liegestuetz",name:"Liegestütze auf den Knien",sports:["zuhause"],category:"kraft",impact:"low",level:2,measure:"reps",base:{sets:3,reps:8,restSec:60},met:4,steps:["Auf die Knie, Hände etwas breiter als die Schultern.","Von Knie bis Kopf eine Linie – kein Hohlkreuz.","Brust Richtung Boden senken.","Wieder hochdrücken."],tip:"Lieber 5 saubere als 10 halbe.",easier:"wand-liegestuetz",lowImpactAlt:"wand-liegestuetz"},{id:"unterarmstuetz",name:"Unterarmstütz",sports:["zuhause","studio"],category:"kraft",impact:"low",level:1,measure:"time",base:{sets:3,sec:20,restSec:45},met:3.8,steps:["Unterarme auf den Boden, Ellbogen unter den Schultern.","Auf die Zehen oder – leichter – auf die Knie.","Bauch fest, Po weder hoch noch durchhängen lassen.","Ruhig weiteratmen und halten."],tip:"Wenn es zittert, wirkt es. Wenn es weh tut im Rücken: aufhören.",lowImpactAlt:"unterarmstuetz"},{id:"beckenheben",name:"Beckenheben",sports:["zuhause"],category:"kraft",impact:"low",level:1,measure:"reps",base:{sets:3,reps:12,restSec:45},met:3.5,steps:["Auf den Rücken legen, Füße aufgestellt.","Po anspannen und das Becken heben, bis Knie, Hüfte und Schultern eine Linie bilden.","Kurz halten.","Langsam wieder ablegen."],tip:"Gut für den Rücken nach langem Sitzen."},{id:"hampelmann",name:"Hampelmann",sports:["zuhause"],category:"ausdauer",impact:"high",level:1,measure:"time",base:{sets:3,sec:30,restSec:30},met:8,steps:["Aufrecht stehen, Arme locker.","Springend die Beine öffnen und die Arme über den Kopf führen.","Zurückspringen.","Locker im Rhythmus bleiben."],tip:"Nachbarn unter dir? Dann Seitschritte statt Springen.",lowImpactAlt:"seitschritte",easier:"seitschritte"},{id:"seitschritte",name:"Seitschritte mit Armen",sports:["zuhause"],category:"ausdauer",impact:"low",level:1,measure:"time",base:{sets:3,sec:40,restSec:30},met:4,steps:["Einen Schritt zur Seite, Arme dabei über den Kopf.","Fuß nachziehen, Arme runter.","Zur anderen Seite.","Tempo so, dass du noch reden könntest."],tip:"Musik an. Wirkt Wunder.",harder:"hampelmann"},{id:"katze-kuh",name:"Katze und Kuh",sports:["zuhause","studio"],category:"beweglichkeit",impact:"low",level:1,measure:"reps",base:{sets:1,reps:10,restSec:0},met:2.3,steps:["In den Vierfüßlerstand gehen.","Ausatmen: Rücken rund machen wie eine Katze.","Einatmen: Rücken sanft durchhängen lassen, Blick nach vorn.","Langsam im Atemrhythmus wechseln."],tip:"Ideal gleich nach dem Aufstehen."},{id:"hueftbeuger",name:"Hüftbeuger dehnen",sports:["zuhause","studio"],category:"beweglichkeit",impact:"low",level:1,measure:"time",base:{sets:2,sec:30,restSec:0},met:2.3,steps:["Ein Knie auf den Boden (Kissen drunter), anderer Fuß vorn aufgestellt.","Becken leicht nach vorn schieben, bis es vorn an der Hüfte zieht.","Oberkörper aufrecht.","Halten, dann Seite wechseln."],tip:"Wer viel sitzt, braucht genau das."},{id:"einbeinstand",name:"Einbeinstand",sports:["zuhause","studio"],category:"gleichgewicht",impact:"low",level:1,measure:"time",base:{sets:2,sec:20,restSec:0},met:2,steps:["Neben einen Stuhl oder eine Wand stellen.","Ein Bein leicht anheben.","Blick auf einen festen Punkt.","Halten, dann Seite wechseln. Nur festhalten, wenn nötig."],tip:"Geht auch beim Zähneputzen."},{id:"beinpresse",name:"Beinpresse",sports:["studio"],category:"kraft",impact:"low",level:1,measure:"weight",base:{sets:3,reps:12,restSec:90},met:5,steps:["Sitz so einstellen, dass die Knie etwa im rechten Winkel sind.","Füße hüftbreit mittig auf die Platte.","Gleichmäßig wegdrücken, Knie nicht ganz durchstrecken.","Langsam zurück."],tip:"Gewicht so wählen, dass die letzten 2 Wiederholungen anstrengend sind."},{id:"rudern-maschine",name:"Rudern am Kabelzug",sports:["studio"],category:"kraft",impact:"low",level:1,measure:"weight",base:{sets:3,reps:12,restSec:90},met:5,steps:["Aufrecht sitzen, Griff mit beiden Händen.","Ellbogen eng am Körper nach hinten ziehen.","Schulterblätter zusammen.","Kontrolliert zurück."],tip:"Nicht mit dem Oberkörper mitschaukeln."},{id:"geh-lauf",name:"Gehen und Laufen im Wechsel",sports:["laufen"],category:"ausdauer",impact:"high",level:1,measure:"minutes",base:{min:20},met:6,steps:["5 Minuten zügig gehen zum Aufwärmen.","Dann 1 Minute locker laufen, 2 Minuten gehen – im Wechsel.","Laufen so langsam, dass du dich unterhalten könntest.","Zum Schluss 3 Minuten gehen."],tip:"Niemand muss sehen, wie langsam du bist. Das ist das Schöne am Anfang.",lowImpactAlt:"zuegig-gehen"},{id:"zuegig-gehen",name:"Zügig gehen",sports:["laufen"],category:"ausdauer",impact:"low",level:1,measure:"minutes",base:{min:25},met:3.8,steps:["Bequeme Schuhe, los geht’s.","Tempo so, dass du leicht außer Atem bist, aber noch reden kannst.","Arme mitschwingen.","Gern mit Steigung, wenn es gut geht."],tip:"Podcast a
